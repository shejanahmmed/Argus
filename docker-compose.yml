services:
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_local_dev_password
      POSTGRES_DB: argus_control_plane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: argus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: argus_telemetry
      CLICKHOUSE_USER: argus
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: argus_clickhouse_dev_password
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: argus-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  argus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-control-plane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ARGUS_ENV=development
      - ARGUS_STORAGE_BACKEND=sqlite
      - ARGUS_DB_PATH=/app/.argus_logs/argus.db
      - ARGUS_AUTH_SECRET=argus-local-dev-hmac-secret-key-2026
      - ARGUS_ALLOW_ANONYMOUS=true
    volumes:
      - argus_data:/app/.argus_logs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  argus_data:
